# https://gethomepage.dev/configs/services/
# More tiles come from homepage.* labels on containers; weight sets the order in a group.

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://media.saulreyna.com
        description: Movies & TV
        weight: 100
        server: nyx
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2            # Jellyfin 10.12+
          enableBlocks: true
          enableNowPlaying: true

    - Kavita:
        icon: kavita.svg
        href: https://kavita.saulreyna.com
        description: Books & comics
        weight: 500
        server: nyx
        container: kavita

- Photos & Files:
    - Immich:
        icon: immich.svg
        href: https://photos.saulreyna.com
        description: Photos
        server: nyx
        container: immich_server
        # needs HOMEPAGE_VAR_IMMICH_KEY in dashboard/.env
        # widget:
        #   type: immich
        #   url: http://immich_server:2283
        #   key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
        #   version: 2

    - ownCloud:
        icon: owncloud.svg
        href: https://cloud.saulreyna.com
        description: Documents (login only works via the domain)
        server: nyx
        container: ocis

- Apps:
    - Vaultwarden:
        icon: vaultwarden.svg
        href: https://vw.saulreyna.com
        description: Passwords (runs on the Pi)
        siteMonitor: https://vw.saulreyna.com/alive

    - Gitea:
        icon: gitea.svg
        href: https://git.saulreyna.com
        description: Git (SSH on port 2222)
        server: nyx
        container: gitea
        widget:
          type: gitea
          url: http://gitea:3000
          key: "{{HOMEPAGE_VAR_GITEA_KEY}}"

    - Firefly III:
        icon: firefly-iii.svg
        href: https://firefly.saulreyna.com
        description: Budgeting
        server: nyx
        container: firefly

    - Firefly Importer:
        icon: firefly-iii.svg
        href: https://importer.saulreyna.com
        description: Import into Firefly
        server: nyx
        container: firefly-importer

    - Vikunja:
        icon: vikunja.svg
        href: https://todo.saulreyna.com
        description: To-do lists
        server: nyx
        container: vikunja

- System:
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://kuma.saulreyna.com
        description: Watches nyx (runs on the Pi)
        siteMonitor: https://kuma.saulreyna.com

    - AdGuard Home:
        icon: adguard-home.svg
        href: https://adguard.saulreyna.com
        description: Home DNS + ad blocking (runs on the Pi)
        widget:
          type: adguard
          url: https://adguard.saulreyna.com
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - ntfy:
        icon: ntfy.svg
        href: https://ntfy.saulreyna.com
        description: Phone notifications (runs on the Pi)
        siteMonitor: https://ntfy.saulreyna.com/v1/health

    - Speedtest Tracker:
        icon: speedtest-tracker.svg
        href: https://speed.saulreyna.com
        description: Internet speed every 2 hours
        server: nyx
        container: speedtest-tracker

    - Caddy:
        icon: caddy.svg
        description: HTTPS reverse proxy
        server: nyx
        container: caddy

# Links go through Authelia; the Scrutiny widget reaches it on admin_network
- Admin:
    - Authelia:
        icon: authelia.svg
        href: https://auth.saulreyna.com
        description: Sign-in for the admin tools
        server: nyx
        container: authelia

    - Dozzle:
        icon: dozzle.svg
        href: https://logs.saulreyna.com
        description: Container logs (nyx + Pi)
        server: nyx
        container: dozzle

    - Scrutiny:
        icon: scrutiny.svg
        href: https://disks.saulreyna.com
        description: Disk health (SMART)
        server: nyx
        container: scrutiny
        widget:
          type: scrutiny
          url: http://scrutiny:8080

    - Backrest:
        icon: backrest.svg
        href: https://backups.saulreyna.com
        description: Browse/restore offsite backups
        server: nyx
        container: backrest
        # no widget: it only reports Backrest's own plans, and backups run from scripts/backup-offsite.sh
