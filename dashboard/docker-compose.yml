# No login: the home network and Tailscale go straight in, others through Authelia
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file: .env                     # HOMEPAGE_VAR_* keys used in config/services.yaml
    environment:
      - PUID=1000
      - PGID=${DOCKER_GID}             # docker group, for container status
      - HOMEPAGE_ALLOWED_HOSTS=home.saulreyna.com,192.168.50.144:3000,nyx:3000,localhost:3000
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/storage:/mnt/storage:ro   # pool usage widget
    ports:
      - 3000:3000
    networks:
      - default
      - admin_network                  # Scrutiny widget
    restart: unless-stopped

networks:
  default:
    name: arr_network
    external: true
  admin_network:
    external: true
