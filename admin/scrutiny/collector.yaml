# The USB enclosure needs smartctl's "-d sat". Devices are mapped in docker-compose.yml.
version: 1
host:
  id: nyx
devices:
  - device: /dev/sda
    type: sat
  - device: /dev/sdb
    type: sat
  - device: /dev/sdc
    type: sat
  - device: /dev/sdd
    type: sat
  - device: /dev/nvme0
    type: nvme
