# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
# After editing:  docker exec authelia authelia validate-config --config /config/configuration.yml
#                 docker restart authelia

theme: auto

server:
  address: tcp://:9091

log:
  level: info

totp:
  issuer: saulreyna.com

webauthn:
  display_name: saulreyna.com
  enable_passkey_login: true

authentication_backend:
  file:
    path: /data/users_database.yml
    watch: true                       # reload on edit
  password_reset:
    disable: false

access_control:
  default_policy: deny
  rules:
    # Only hosts with `import authelia` in the Caddyfile ask
    - domain: '*.saulreyna.com'
      subject: group:admins
      policy: two_factor

session:
  cookies:
    - domain: saulreyna.com
      authelia_url: https://auth.saulreyna.com
      default_redirection_url: https://home.saulreyna.com
  inactivity: 2h
  expiration: 12h
  remember_me: 1M
  redis:
    host: authelia-redis
    port: 6379

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /data/db.sqlite3

# One-time codes for registering 2FA devices and password resets (Mailjet)
notifier:
  smtp:
    address: submission://in-v3.mailjet.com:587
    sender: Authelia <auth@saulreyna.com>
    subject: "[saulreyna.com] {title}"

# The template filter reads the key and secret digests from secrets/, so this file must contain
# no other double braces, comments included.
identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc-jwks-rsa.key" | mindent 10 "|" | msquote }}
    clients:
      # web and phone app
      - client_id: immich
        client_name: Immich
        client_secret: '{{ secret "/secrets/oidc-immich-secret.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://photos.saulreyna.com/auth/login
          - https://photos.saulreyna.com/user-settings
          - app.immich:///oauth-callback
        scopes: [openid, profile, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post

      # "authelia" is the login source name in Gitea
      - client_id: gitea
        client_name: Gitea
        client_secret: '{{ secret "/secrets/oidc-gitea-secret.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://git.saulreyna.com/user/oauth2/authelia/callback
        scopes: [openid, profile, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      # "authelia" is the provider key in apps/vikunja-config.yml
      - client_id: vikunja
        client_name: Vikunja
        client_secret: '{{ secret "/secrets/oidc-vikunja-secret.digest" }}'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://todo.saulreyna.com/auth/openid/authelia
        scopes: [openid, profile, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
