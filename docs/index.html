<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive isometric map of brokentari/home-server: Caddy, Jellyfin, Immich, backups and the Pi.">
<title>Nyx Home Server Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
<style>
/* Stats strip on top, component index left, isometric plan centre, reading panel right */
:root{
  --bg:#cdc398;
  --bg-2:#c3b98c;
  --paper:#e6dfbf;
  --ink:#1c1a13;
  --ink-2:#565038;
  --rule:rgba(28,26,19,.62);
  --grid:rgba(28,26,19,.085);
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1c15;--bg-2:#29261c;--paper:#2f2b20;--ink:#d8cea3;--ink-2:#9a916f;
  --rule:rgba(216,206,163,.55);--grid:rgba(216,206,163,.07);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1c15;--bg-2:#29261c;--paper:#2f2b20;--ink:#d8cea3;--ink-2:#9a916f;
  --rule:rgba(216,206,163,.55);--grid:rgba(216,206,163,.07);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}

/* stats strip */
.top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);min-width:0}
.stats{display:flex;overflow-x:auto;min-width:0;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{padding:6px 16px 7px 12px;border-right:1px solid var(--rule);white-space:nowrap;display:grid;gap:1px}
.stat b{font-weight:400;font-size:15px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;align-items:center;margin-left:auto;padding:6px 0 6px 12px;flex-shrink:0}
.btn{background:transparent;border:1.5px solid var(--ink);padding:5px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.main{display:grid;grid-template-columns:212px minmax(0,1fr) 410px;min-height:0}

/* component index */
.side{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 12px 18px 0;min-height:0}
.grp{margin:14px 0 6px}
.grp:first-child{margin-top:4px}
.item{display:grid;grid-template-columns:30px 1fr auto;align-items:start;gap:4px;width:100%;text-align:left;
  background:transparent;border:1.5px solid var(--ink);padding:5px 8px 5px 8px;margin:0 0 5px;cursor:pointer;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;line-height:1.35}
.item .c{color:var(--ink-2);font-size:10px;padding-top:1px}
.item .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.item:hover{background:var(--bg-2)}
.item.on{background:var(--ink);color:var(--bg)}
.item.on .c,.item.on .n{color:var(--bg)}
.item.sub{margin-left:14px;width:calc(100% - 14px);border-color:var(--rule)}
.sublab{margin:2px 0 5px;font-size:10px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase;padding-left:2px}

/* stage */
.stage{position:relative;overflow:hidden;min-height:0;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.stage svg{display:block;width:100%;height:100%}
.crumb{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:auto}
.crumb .path{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.zoom{position:absolute;right:14px;top:12px;display:grid;gap:6px}
.zoom .btn{width:28px;height:26px;padding:0;font-size:14px;letter-spacing:0;background:var(--bg)}
.legend{position:absolute;left:14px;right:14px;bottom:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;max-width:280px;background:var(--ink);color:var(--bg);padding:7px 9px;font-size:11.5px;line-height:1.45;pointer-events:none;z-index:5}
.tip b{display:block;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;margin-bottom:2px}

/* svg drawing */
.grid{stroke:var(--grid);stroke-width:1;fill:none}
.plate{fill:none;stroke:var(--rule);stroke-width:1}
.plate.dash{stroke-dasharray:5 4}
.plabel{fill:var(--ink-2);font-size:9.5px;letter-spacing:.18em;font-family:var(--mono)}
.edge{fill:none;stroke:var(--ink);stroke-width:1.05}
.edge.faint{stroke:var(--rule);stroke-dasharray:4 4}
.edge.lit{stroke-width:2.2}
.knot{fill:var(--ink)}
.face{stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
.face.top{fill:url(#hTop)}
.face.rt{fill:url(#hRight)}
.face.lf{fill:url(#hLeft)}
.open .face{fill:var(--paper)}
.open .face.rt{fill:var(--bg-2)}
.shell .face{fill:none;stroke-dasharray:4 3}
.pbg{fill:var(--bg)}
.pl{stroke:var(--ink);stroke-width:.6}
.blk{cursor:pointer}
.blk text{font-family:var(--mono);font-size:9px;fill:var(--ink);letter-spacing:.06em;pointer-events:none}
.blk:hover .face{stroke-width:1.7}
.blk.sel .face.top{fill:var(--ink)}
.blk.sel text.code{fill:var(--bg)}
.blk.sel .face{stroke-width:1.8}
.blk.hit .face.top{fill:var(--ink);transition:fill .1s}
.blk.hit text.code{fill:var(--bg)}
.flabel{font-family:var(--mono);font-size:8.6px;letter-spacing:.12em;fill:var(--ink)}
.flag{fill:var(--ink)}
.flagt{fill:var(--bg);font-family:var(--mono);font-size:8px;font-weight:600}
.dot{cursor:pointer}
.dot .hit{fill:transparent}
.dot .core{fill:var(--ink)}
.dot .halo{fill:none;stroke:var(--ink);stroke-width:1;opacity:0}
.dot.sel .halo{opacity:1}
.dot.sel .core{r:4.2}

/* reading panel */
.panel{border-left:1.5px solid var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--ink)}
.tab{background:transparent;border:0;padding:8px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.tab+.tab{border-left:1.5px solid var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.body{overflow-y:auto;padding:16px 18px 28px;min-width:0}
.body h1{font-size:23px;font-weight:400;letter-spacing:.02em;margin:4px 0 2px;line-height:1.2;text-wrap:balance}
.body .sub{color:var(--ink-2);font-size:12px;margin:0 0 18px}
.body h2{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);font-weight:400;margin:22px 0 10px;padding-bottom:5px;border-bottom:1.5px solid var(--ink)}
.body p{margin:0 0 12px;font-size:13.5px;line-height:1.72;max-width:62ch}
mark,.mk{background:var(--ink);color:var(--bg);padding:0 3px}
.body code{font-family:var(--mono);background:var(--bg-2);padding:0 3px}
pre.snip{background:var(--ink);color:var(--bg);padding:11px 12px;font-size:11.5px;line-height:1.6;overflow-x:auto;margin:0 0 12px;white-space:pre}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;font-size:12px;margin:0 0 12px}
.kv dt{color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;padding-top:2px}
.kv dd{margin:0;word-break:break-word}
.cond{border:1.5px solid var(--ink);padding:8px 10px;margin:0 0 8px;font-size:12.5px;line-height:1.55}
.cond b{font-weight:500;display:block}
.cond span{color:var(--ink-2)}
.steps{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:5px}
.steps button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;width:100%;text-align:left;background:transparent;border:1px solid var(--rule);padding:6px 8px;cursor:pointer;font-size:12px;line-height:1.45}
.steps button:hover{background:var(--bg-2)}
.steps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps .k{color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.inline{background:var(--ink);color:var(--bg);border:0;padding:1px 5px;cursor:pointer;font-size:12.5px}
.links{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.links button{background:transparent;border:1px solid var(--ink);padding:2px 7px;font-size:11px;letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.links button:hover{background:var(--ink);color:var(--bg)}
table.folders{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 12px}
table.folders td{border-top:1px solid var(--rule);padding:5px 6px 5px 0;vertical-align:top}
table.folders td:first-child{white-space:nowrap;padding-right:10px}
table.folders td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}

/* phone */
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;border:0}
  .top{flex-wrap:wrap}
  .stats{width:100%;border-bottom:1px solid var(--rule)}
  .stat:first-child{padding-left:0}
  .acts{margin-left:0;padding:8px 0;width:100%;flex-wrap:wrap}
  .acts .btn{flex:1 1 auto;padding:7px 8px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .side{border-right:0;border-bottom:1.5px solid var(--ink);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 0;scrollbar-width:thin}
  .side .grp,.side .sublab{display:none}
  .item,.item.sub{flex:0 0 auto;width:auto;margin:0;grid-template-columns:auto auto;white-space:nowrap}
  .item .n{display:none}
  .stage{height:62vh;min-height:360px;border-bottom:1.5px solid var(--ink)}
  .legend{display:none}
  .panel{border-left:0}
  .body{padding:14px 0 28px;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.blk.hit .face.top{transition:none}}
</style>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="stats" id="stats"></div>
    <div class="acts">
      <button class="btn" id="play" aria-pressed="false">▶ Resume the flow</button>
      <button class="btn" id="step">Trace one step</button>
      <button class="btn" id="reset">Reset view</button>
    </div>
  </header>
  <div class="main">
    <nav class="side" id="side" aria-label="Components"></nav>
    <section class="stage" id="stage" aria-label="Isometric map of the stack">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hTop" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect class="pbg" width="3.4" height="3.4"/><line class="pl" x1="0" y1="0" x2="0" y2="3.4"/></pattern>
          <pattern id="hRight" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect class="pbg" width="2.6" height="2.6"/><line class="pl" x1="0" y1="0" x2="0" y2="2.6"/></pattern>
          <pattern id="hLeft" width="2.4" height="2.4" patternUnits="userSpaceOnUse"><rect class="pbg" width="2.4" height="2.4"/><line class="pl" x1="0" y1="0" x2="0" y2="2.4"/></pattern>
        </defs>
        <g id="world"><g id="content"></g><g id="dots"></g></g>
      </svg>
      <div class="crumb" id="crumb" hidden><span class="path" id="crumbPath"></span><button class="btn" id="out">← Come back out</button></div>
      <div class="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button></div>
      <div class="legend" id="legend">→ go inside · ← come back out · ↓ ↑ move · hover to read · click a dot to inspect · drag to pan · scroll to zoom</div>
      <div class="tip" id="tip" hidden></div>
    </section>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tWhat" aria-selected="true">What it does</button>
        <button class="tab" role="tab" id="tHow" aria-selected="false">How it's built</button>
      </div>
      <div class="body" id="body"></div>
    </aside>
  </div>
</div>

<script>
(()=>{
/* data: what is on nyx and the Pi */

const STATS=[
  ['Repository','home-server · 5314e7f'],
  ['Hosts','2 · nyx + raspberrypi'],
  ['Compose stacks','9 on nyx'],
  ['Containers','27 on nyx · 5 on the Pi'],
  ['Hostnames','14 under saulreyna.com'],
  ['Nightly jobs','5 · 2:00 → 4:30'],
  ['Offsite','restic → R2 · 7d 5w 12m'],
];

const COND={
  disk3:['Disk 3 has logged a reallocated sector','WD20EARS. Replace it first if the count grows.'],
  old:['Four 2 TB drives from 2009–2011','Healthy for now: low power-on hours, no pending sectors. Long term, two larger modern drives.'],
  ups:['No UPS','A power cut is an unclean shutdown for the USB enclosure and for the Pi’s SD card. NUT is on the list.'],
  sd:['The Pi boots from an SD card','Moving it to an SSD is on the list.'],
  picaddy:['The Pi’s Caddy has no update path','A custom xcaddy binary and no Go on the Pi. Plan: build it from nyx’s proxy/Dockerfile.'],
  kernel:['Kernel updates wait for a manual reboot','unattended-upgrades installs security fixes daily on both machines but never reboots.'],
  net50:['Remote access fails from networks using the same LAN range','A common ASUS default. The tailnet route would collide with the local one.'],
};

const GROUPS=[['door','The front door'],['media','Media'],['data','Your data'],['watch','Keeping watch'],['safe','Kept safe']];

const S=(t)=>t.replace(/^\n/,'');
const B=[
 /* front door */
 {id:'Z',name:'Your devices',g:'door',kind:'open',x:-7.4,y:9,w:2.6,d:1.6,h:1.1,n:'—',
  hover:'Phone and laptops. At home they use the LAN directly; away, they join the tailnet.',
  sub:'where every request starts',
  what:['Every request starts here: the Jellyfin or Immich app on the phone, a browser tab on <code>home.saulreyna.com</code>, a <code>git push</code> to port 2222.',
        'Away from home the phone is on the <mark>tailnet</mark>, so it reaches the same LAN addresses with the same certificates it uses on the couch. Nothing on the router is forwarded.'],
  how:{file:'README.md → Remote access, Gitea',snip:S(`
# ~/.ssh/config on each computer
Host git.saulreyna.com
  Port 2222
# existing git@git.saulreyna.com:… remotes keep working`)},cond:['net50']},
 {id:'T',name:'Tailscale',g:'door',x:1,y:9,w:2,d:2,h:.55,n:'2',
  hover:'Both nyx and the Pi advertise <home-lan>/24. One is active; the other takes over in about 15 s.',
  sub:'two subnet routers for the home LAN',
  what:['nyx and the Pi are both Tailscale <mark>subnet routers</mark> for <code>&lt;home-lan&gt;/24</code>. One carries the route and the other takes over automatically if it drops off.',
        'Through the Pi, traffic arrives from a LAN address; through nyx it keeps the phone’s <code>100.x</code> Tailscale address. Caddy lets both into Homepage without a sign-in.'],
  how:{file:'README.md → Remote access · scripts/setup-nyx-root.sh',snip:S(`
sudo tailscale up --advertise-routes=<home-lan>/24 --hostname=nyx
tailscale set --auto-update
# key expiry off, route approved in the admin console
# --accept-routes stays off on both (they'd route their own LAN through each other)`)},cond:['net50']},
 {id:'D',name:'AdGuard Home',g:'door',host:'pi',x:4,y:-7.6,w:2,d:2,h:1.4,n:'1',
  hover:'The home network’s DNS, on the Pi. Answers *.saulreyna.com itself, so names resolve with the internet down.',
  sub:'DNS for the whole house, on the Pi',
  what:['The router hands out the Pi as the DNS server. AdGuard answers <mark>*.saulreyna.com</mark> itself, so home access keeps working when the internet or Cloudflare is down.',
        'Everything else goes upstream over DNS-over-HTTPS with the AdGuard blocklist. If the Pi is down, devices fall back to the router’s secondary DNS: no ad blocking, but the public records point at the same LAN IPs.'],
  how:{file:'Pi: ~/home-server · README.md → Home DNS',snip:S(`
*.saulreyna.com          → <nyx-ip>  (nyx)
vw kuma ntfy adguard     → <pi-ip>  (Pi)
me                       → public DNS (Cloudflare Workers)
everything else          → DoH: Cloudflare + Quad9
query log + stats        → 7 days`)},cond:['sd','picaddy']},
 {id:'C',name:'Caddy',g:'door',x:4.5,y:8,w:3,d:3,h:3.2,n:'1',
  hover:'The only thing listening on 443. One wildcard cert, one handle block per hostname.',
  sub:'one certificate, every hostname',
  what:['Caddy is the only thing that answers on 443. It holds <mark>one wildcard certificate</mark> for <code>*.saulreyna.com</code>, issued through the Cloudflare DNS-01 challenge, so no port is open to the internet and a new app never needs a new cert.',
        'Each hostname is a <code>handle</code> block that proxies to a container by name over the shared <code>arr_network</code>. Homepage has no login, so Caddy sends anyone outside the home network and Tailscale to Authelia first. Any other subdomain gets its connection dropped.'],
  how:{file:'proxy/Caddyfile · proxy/Dockerfile · proxy/docker-compose.yml',image:'caddy:2 built with caddy-dns/cloudflare (xcaddy)',ports:'80 · 443 · 443/udp (HTTP/3)',snip:S(`
@homepage host {$HOMEPAGE_DOMAIN}
handle @homepage {
	@outside not remote_ip private_ranges 100.64.0.0/10
	route @outside {
		import authelia
	}
	reverse_proxy homepage:3000
}`)},cond:[],
  inside:[
   {name:'Resolve the name',desc:'AdGuard on the Pi answers every <code>*.saulreyna.com</code> name with nyx’s LAN address. Away from home, the same answer comes back and the tailnet carries the packet.',snip:'media.saulreyna.com  A  <nyx-ip>\n(DHCP reservation on the router)'},
   {name:'Terminate TLS',desc:'One wildcard certificate covers every app. Caddy renews it over DNS-01 with a Cloudflare token, so port 80 is never needed for validation.',snip:'(cloudflare_tls) {\n\ttls {\n\t\tdns cloudflare {env.CF_API_TOKEN}\n\t}\n}\n# certs persist in proxy/data',h:1.8},
   {name:'Match the host',desc:'A named matcher per hostname picks the handle block.',snip:'@immich host {$IMMICH_DOMAIN}\nhandle @immich {\n\treverse_proxy immich_server:2283\n}'},
   {name:'Home or sign-in',desc:'Homepage has no login. The home network and Tailscale go straight in; anyone else signs in with Authelia first.',snip:'@outside not remote_ip private_ranges 100.64.0.0/10\nroute @outside {\n\timport authelia\n}',h:1.5},
   {name:'Proxy by name',desc:'Containers on <code>arr_network</code> are reached by container name. Jellyfin also gets compression; WebSockets are upgraded automatically.',snip:'jellyfin:8096          immich_server:2283\nocis:9200              homepage:3000\ngitea:3000             firefly:8080\nfirefly-importer:8080  vikunja:3456\nkavita:5000            speedtest-tracker:80',h:2},
   {name:'Drop the rest',desc:'Any other subdomain that points here gets its connection dropped.',snip:'handle {\n\tabort\n}',h:.8},
  ]},
 /* media */
 {id:'J',name:'Jellyfin',g:'media',x:21,y:1.5,w:4.6,d:4.6,h:2.2,n:'1',
  hover:'Streams the library at media.saulreyna.com. Transcodes on the Intel iGPU with QuickSync.',
  sub:'media.saulreyna.com',
  what:['Streams the movie and TV library. Libraries point at <code>/data/media</code> on the pool, read-only in practice.',
        'nyx’s Intel iGPU is passed through as <code>/dev/dri</code>, so transcoding runs on <mark>QuickSync</mark> instead of the CPU.'],
  how:{file:'media/docker-compose.yml',image:'lscr.io/linuxserver/jellyfin:latest',ports:'8096 (Caddy: media.saulreyna.com)',snip:S(`
jellyfin:
  volumes:
    - \${DATA_ROOT}/media:/data/media
  devices:
    - /dev/dri:/dev/dri       # Intel iGPU → QSV transcoding
  group_add:
    - "\${RENDER_GID}"`)},cond:[]},
 /* data */
 {id:'I',name:'Immich',g:'data',x:10,y:9.5,w:3,d:3,h:2.8,n:'4',
  hover:'Photos at photos.saulreyna.com. Originals on the pool, Postgres on the NVMe.',
  sub:'photos.saulreyna.com',
  what:['The phone backs up every photo and video here. Originals, thumbnails and encoded video go to the pool; the database stays on the NVMe because Immich doesn’t support Postgres on FUSE filesystems like mergerfs.',
        'Photos are the part of this house that <mark>can’t be re-downloaded</mark>. They are what the parity disk is really for.'],
  how:{file:'immich/docker-compose.yml · immich/hwaccel.transcoding.yml',image:'immich-server, immich-machine-learning :${IMMICH_VERSION:-release} · valkey:9 · immich postgres 14 + vectorchord',ports:'2283',snip:S(`
#   UPLOAD_LOCATION  (photos, thumbs, DB dumps) -> mergerfs pool
#   DB_DATA_LOCATION (Postgres)                 -> local NVMe
immich-server:
  extends:
    file: hwaccel.transcoding.yml
    service: quicksync`)},
  inside:[

/* geometry */
const U=19, CX=Math.cos(Math.PI/6);
const P=(x,y,z=0)=>[(x-y)*CX*U,(x+y)*.5*U-z*U];
const ptsS=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function foot(b){
  if(b.kind==='cards'){const W=b.cards*b.w+(b.cards-1)*b.gap;return[b.x,b.y,b.x+W,b.y+b.d]}
  return[b.x,b.y,b.x+b.w,b.y+b.d];
}
const center=b=>{const f=foot(b);return[(f[0]+f[2])/2,(f[1]+f[3])/2]};
function route(a,b,mode){
  const [x1,y1]=center(a),[x2,y2]=center(b);
  return mode==='yx'?[[x1,y1],[x1,y2],[x2,y2]]:[[x1,y1],[x2,y1],[x2,y2]];
}

function box(g,x,y,z,w,d,h){
  const top=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  const rt=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)];
  const lf=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  if(h>0){el('polygon',{class:'face rt',points:ptsS(rt)},g);el('polygon',{class:'face lf',points:ptsS(lf)},g)}
  el('polygon',{class:'face top',points:ptsS(top)},g);
  return top;
}
function floorText(parent,x,y,str,cls){
  const [sx,sy]=P(x,y);
  const t=el('text',{class:cls,transform:`matrix(${CX.toFixed(4)},0.5,${(-CX).toFixed(4)},0.5,${sx.toFixed(1)},${sy.toFixed(1)})`},parent);
  t.textContent=str;return t;
}

/* scenes */
const byId=Object.fromEntries(B.map(b=>[b.id,b]));
const MAIN={id:'main',blocks:B,plates:PLATES,edges:EDGES,flows:FLOWS,order:B.map(b=>b.id)};

function stepScene(owner){
  const steps=owner.inside, per=4, blocks=[], edges=[], hops=[];
  steps.forEach((s,i)=>{
    const row=Math.floor(i/per), col=i%per, c=row%2?per-1-col:col;
    blocks.push({id:'s'+i,code:String(i+1),name:s.name,x:c*5.2,y:row*6.4,w:2.6,d:2.6,h:s.h||1.4,step:s,idx:i,flagged:s.flag});
    if(i){
      const pr=Math.floor((i-1)/per);
      edges.push(['s'+(i-1),'s'+i,pr!==row?'yx':'xy']);
      hops.push(['s'+(i-1),'s'+i,s.snip]);
    }
  });
  hops.push(['s'+(steps.length-1),'s0',steps[0].snip]);
  // close the loop along the back with a faint return edge
  edges.push(['s'+(steps.length-1),'s0','yx',1]);
  const rows=Math.ceil(steps.length/per);
  const plates=[{x:-1.6,y:-1.6,w:(Math.min(per,steps.length)-1)*5.2+5.8,d:(rows-1)*6.4+6.4,label:'INSIDE · '+owner.name.toUpperCase()}];
  return{id:owner.id,owner,blocks,plates,edges,flows:[{id:'in-'+owner.id,name:'Inside '+owner.name,hops}],order:blocks.map(b=>b.id),inside:true};
}

const $=id=>document.getElementById(id);
const svg=$('svg'),world=$('world'),content=$('content'),dotsG=$('dots'),stage=$('stage'),tip=$('tip');

/* render scene */
function render(){
  content.textContent='';dotsG.textContent='';blockEls={};edgeEls=[];
  const sb=Object.fromEntries(scene.blocks.map(b=>[b.id,b]));
  // grid
  const f=scene.blocks.map(foot);
  const gx0=Math.floor(Math.min(...f.map(a=>a[0]),...scene.plates.map(p=>p.x))-4),gx1=Math.ceil(Math.max(...f.map(a=>a[2]),...scene.plates.map(p=>p.x+p.w))+4);
  const gy0=Math.floor(Math.min(...f.map(a=>a[1]),...scene.plates.map(p=>p.y))-4),gy1=Math.ceil(Math.max(...f.map(a=>a[3]),...scene.plates.map(p=>p.y+p.d))+4);
  let d='';
  for(let x=gx0;x<=gx1;x+=2){const a=P(x,gy0),b=P(x,gy1);d+=`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`}
  for(let y=gy0;y<=gy1;y+=2){const a=P(gx0,y),b=P(gx1,y);d+=`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`}
  el('path',{class:'grid',d},content);
  const fitG=el('g',{id:'fitg'},content);
  // plates
  for(const p of scene.plates){
    el('polygon',{class:'plate'+(p.dash?' dash':''),points:ptsS([P(p.x,p.y),P(p.x+p.w,p.y),P(p.x+p.w,p.y+p.d),P(p.x,p.y+p.d)])},fitG);
    floorText(fitG,p.x+.25,p.y-.3,p.label,'plabel');
  }
  // edges
  for(const [a,b,mode,faint] of scene.edges){
    const r=route(sb[a],sb[b],mode).map(q=>P(q[0],q[1]));
    const pe=el('polyline',{class:'edge'+(faint?' faint':''),points:ptsS(r)},fitG);
    edgeEls.push({a,b,el:pe});
    if(!faint){const k=r[1];el('rect',{class:'knot',x:k[0]-2.6,y:k[1]-2.6,width:5.2,height:5.2,transform:`rotate(45 ${k[0].toFixed(1)} ${k[1].toFixed(1)})`},fitG)}
  }
  // blocks, back to front
  const sorted=[...scene.blocks].sort((p,q)=>{const a=foot(p),b=foot(q);return(a[0]+a[2]+a[1]+a[3])-(b[0]+b[2]+b[1]+b[3])});
  for(const b of sorted){
    const g=el('g',{class:'blk'+(b.kind==='open'?' open':''),tabindex:'-1','data-id':b.id},fitG);
    let top;
    if(b.kind==='cards'){for(let i=0;i<b.cards;i++)top=box(g,b.x+i*(b.w+b.gap),b.y,0,b.w,b.d,b.h)}
    else if(b.kind==='stack'){for(let i=0;i<b.layers;i++)top=box(g,b.x,b.y,i*(b.h+b.gap),b.w,b.d,b.h)}
    else if(b.kind==='shell'){
      const n=b.inner;box(g,n.x,n.y,0,n.w,n.d,n.h);
      const s=el('g',{class:'shell'},g);top=box(s,b.x,b.y,0,b.w,b.d,b.h);
      top=[P(n.x,n.y,n.h),P(n.x+n.w,n.y,n.h),P(n.x+n.w,n.y+n.d,n.h),P(n.x,n.y+n.d,n.h)];
    }
    else top=box(g,b.x,b.y,0,b.w,b.d,b.h);
    const cx=top.reduce((s,p)=>s+p[0],0)/4, cy=top.reduce((s,p)=>s+p[1],0)/4;
    const label=b.code||b.id;
    const t=el('text',{class:'code',x:cx.toFixed(1),y:(cy+3).toFixed(1),'text-anchor':'middle'},g);t.textContent=label;
    if(scene.inside){const ft=foot(b);floorText(g,ft[0],ft[3]+.75,b.name.toUpperCase(),'flabel')}
    if(b.flagged){const [fx,fy]=P(b.x+b.w,b.y,b.h);el('rect',{class:'flag',x:fx-2,y:fy-14,width:11,height:11},g);const ft=el('text',{class:'flagt',x:fx+3.5,y:fy-5.6,'text-anchor':'middle'},g);ft.textContent='!'}
    g.addEventListener('click',e=>{if(dragged)return;e.stopPropagation();select(b.id)});
    g.addEventListener('dblclick',e=>{e.stopPropagation();if(byId[b.id]&&byId[b.id].inside&&!scene.inside)goInside(b.id)});
    g.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showTip(b,e)});
    g.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')moveTip(e)});
    g.addEventListener('pointerleave',()=>tip.hidden=true);
    blockEls[b.id]=g;
  }
  // flows
  flowsLive=scene.flows.map((fl,fi)=>{
    const hops=fl.hops.map(([a,b,snip])=>({a,b,snip,...samples(sb,a,b)}));
    const dot=el('g',{class:'dot'},dotsG);
    el('circle',{class:'hit',r:11},dot);el('circle',{class:'halo',r:8},dot);el('circle',{class:'core',r:3.2},dot);
    const live={fl,hops,dot,i:fi%hops.length,t:reduce?.5:Math.random(),wait:0};
    if(scene.inside){live.i=0;live.t=0}
    dot.addEventListener('click',e=>{if(dragged)return;e.stopPropagation();selectDot(live)});
    dot.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){tip.innerHTML=`<b>${esc(fl.name)}</b>Data in flight. Click to read the snippet.`;tip.hidden=false;moveTip(e)}});
    dot.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')moveTip(e)});
    dot.addEventListener('pointerleave',()=>tip.hidden=true);
    return live;
  });
  flowsLive.forEach(drawDot);
  markSel();
}

function samples(sb,a,b){
  const A=sb[a],Bk=sb[b];
  let mode='xy',rev=false,found=scene.edges.find(e=>e[0]===a&&e[1]===b);
  if(!found){found=scene.edges.find(e=>e[0]===b&&e[1]===a);rev=true}
  if(found)mode=found[2];
  let r=rev?route(Bk,A,mode).reverse():route(A,Bk,mode);
  const inF=(q,blk,pad)=>{const f=foot(blk);return q[0]>f[0]-pad&&q[0]<f[2]+pad&&q[1]>f[1]-pad&&q[1]<f[3]+pad};
  const st=.12, all=[];
  for(let i=0;i<r.length-1;i++){
    const [x1,y1]=r[i],[x2,y2]=r[i+1],L=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.ceil(L/st));
    for(let j=0;j<n;j++)all.push([x1+(x2-x1)*j/n,y1+(y2-y1)*j/n]);
  }
  all.push(r[r.length-1]);
  // keep the longest run outside both end footprints
  let best=[],cur=[];
  for(const q of all){if(inF(q,A,.15)||inF(q,Bk,.15)){if(cur.length>best.length)best=cur;cur=[]}else cur.push(q)}
  if(cur.length>best.length)best=cur;
  if(best.length<2)best=[all[0],all[all.length-1]];
  return{pts:best.map(q=>P(q[0],q[1])),len:best.length*st};
}

function drawDot(f){
  const h=f.hops[f.i];
  if(f.wait>0&&!(selDot===f)){f.dot.setAttribute('opacity','0');return}
  const n=h.pts.length-1, pos=Math.min(n,f.t*n), k=Math.floor(pos), r=pos-k;
  const p=h.pts[k],q=h.pts[Math.min(n,k+1)];
  f.dot.setAttribute('opacity','1');
  f.dot.setAttribute('transform',`translate(${(p[0]+(q[0]-p[0])*r).toFixed(1)} ${(p[1]+(q[1]-p[1])*r).toFixed(1)})`);
}
function pulse(id){const g=blockEls[id];if(!g||reduce)return;g.classList.add('hit');setTimeout(()=>g.classList.remove('hit'),420)}

const SPEED=7;
function advance(f,dt){
  if(f.wait>0){f.wait-=dt;return}
  const h=f.hops[f.i];
  f.t+=dt*SPEED/Math.max(1,h.len);
  if(f.t>=1){
    pulse(h.b);
    f.i=(f.i+1)%f.hops.length;f.t=0;
    f.wait=f.i===0?1.4:.42;
    if(selDot===f){f.wait=.42;renderPanel()}
  }
}
let last=0;
function tick(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(playing)flowsLive.forEach(f=>advance(f,dt));
  flowsLive.forEach(drawDot);
  requestAnimationFrame(tick);
}

/* selection & panel */

}
function select(id){sel=id;selDot=null;markSel();renderPanel()}
function selectDot(f){selDot=f;sel=null;markSel();renderPanel()}

/* inside / outside */
function goInside(id){
  const b=byId[id];if(!b||!b.inside)return;
  scene=stepScene(b);sel=null;selDot=null;
  $('crumb').hidden=false;$('crumbPath').textContent='nyx / '+b.name;
  render();fit();renderPanel();markSel();
}
function comeOut(re=true){
  if(!scene.inside)return;
  const owner=scene.owner.id;
  scene=MAIN;$('crumb').hidden=true;selDot=null;sel=owner;
  render();fit();if(re){renderPanel()}markSel();
}

/* controls */
function syncPlay(){const b=$('play');b.textContent=playing?'❚❚ Pause the flow':'▶ Resume the flow';b.setAttribute('aria-pressed',playing)}
$('play').onclick=()=>{playing=!playing;syncPlay()};
function traceStep(){
  playing=false;syncPlay();
  let f=selDot||flowsLive[0];
  if(!selDot){selDot=f;sel=null}
  else{pulse(f.hops[f.i].b);f.i=(f.i+1)%f.hops.length}
  f.t=.55;f.wait=0;markSel();renderPanel();drawDot(f);
}
$('step').onclick=traceStep;
$('reset').onclick=()=>{if(scene.inside)comeOut(false);sel=null;selDot=null;markSel();fit();renderPanel()};
$('out').onclick=()=>comeOut();
$('tWhat').onclick=()=>{tab='what';renderPanel()};
$('tHow').onclick=()=>{tab='how';renderPanel()};

/* pan & zoom */
function applyView(){world.setAttribute('transform',`translate(${view.tx.toFixed(1)} ${view.ty.toFixed(1)}) scale(${view.k.toFixed(4)})`)}
function size(){const r=stage.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);return r}
function fit(){
  const r=size();const bb=(document.getElementById('fitg')||content).getBBox();
  const padX=Math.min(60,r.width*.06),padTop=54,padBot=40;
  const k=Math.min((r.width-padX*2)/bb.width,(r.height-padTop-padBot)/bb.height,2.2);
  view={k,tx:r.width/2-(bb.x+bb.width/2)*k,ty:padTop+(r.height-padTop-padBot)/2-(bb.y+bb.height/2)*k};applyView();
}
function zoomAt(f,cx,cy){const k=Math.max(.25,Math.min(5,view.k*f));const s=k/view.k;view.tx=cx-(cx-view.tx)*s;view.ty=cy-(cy-view.ty)*s;view.k=k;applyView()}
function centerOn(id){
  const g=blockEls[id];if(!g)return;const bb=g.getBBox(),r=stage.getBoundingClientRect();
  const k=Math.max(view.k,1);view.k=k;view.tx=r.width/2-(bb.x+bb.width/2)*k;view.ty=r.height/2-(bb.y+bb.height/2)*k;applyView();
}
$('zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};
$('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});

const ptrs=new Map();let dragged=false,start=null,pinch=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.btn,.crumb,.zoom'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragged=false;
  start={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k}}
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],r=stage.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((pinch.k*d/pinch.d)/view.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);dragged=true;return;
  }
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(!dragged&&Math.hypot(dx,dy)>5){dragged=true;stage.classList.add('drag');tip.hidden=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}}
  if(dragged){view.tx=start.tx+dx;view.ty=start.ty+dy;applyView()}
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;stage.classList.remove('drag');setTimeout(()=>dragged=false,0)};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(dragged)return;if(e.target===svg||e.target.closest('.grid,.plate')||e.target.tagName==='svg'){sel=null;selDot=null;markSel();renderPanel()}});

function showTip(b,e){tip.innerHTML=`<b>${esc(b.code?b.name:b.id+' · '+b.name)}</b>${esc(b.hover||(b.step?b.step.desc.replace(/<[^>]+>/g,''):''))}`;tip.hidden=false;moveTip(e)}
function moveTip(e){const r=stage.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;if(x+290>r.width)x=e.clientX-r.left-290;if(y+90>r.height)y=e.clientY-r.top-90;tip.style.left=x+'px';tip.style.top=y+'px'}

/* keyboard: ↑↓ move, → inside, ← out */
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const ord=scene.order;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();let i=ord.indexOf(sel);
    i=i<0?0:(i+(e.key==='ArrowDown'?1:-1)+ord.length)%ord.length;select(ord[i]);
    if(!scene.inside)document.querySelector(`.item[data-id="${ord[i]}"]`)?.scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowRight'||e.key==='Enter'){if(!scene.inside&&sel&&byId[sel].inside){e.preventDefault();goInside(sel)}}
  else if(e.key==='ArrowLeft'||e.key==='Escape'){if(scene.inside){e.preventDefault();comeOut()}}
});

/* boot */
buildSide();syncPlay();render();fit();renderPanel();
new ResizeObserver(()=>fit()).observe(stage);
requestAnimationFrame(tick);
})();
</script>

</body>
</html>
